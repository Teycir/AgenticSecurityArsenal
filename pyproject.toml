[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-security-arsenal"
version = "1.6.0"
description = "Agent-first security capability framework with MCP interface, scope controls, deterministic labs and structured evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Agentic Security Arsenal contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
agentsec = "agentsec.cli:main"  # legacy alias, not exposed on PATH
AgenticSecurityArsenal = "agentsec.cli:main"  # canonical name (avoids AgentSec Rust collision)

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-ignore = [
    # Scenario pack validation deliberately raises ValueError for malformed
    # type/shape errors; TypeError would misclassify them (see scenarios.py).
    "TRY004",
    # MCPStdioClient.__enter__ returns the runtime client object, not self,
    # by design (matches mcp-inspector protocol contract).
    "PYI034",
]

[tool.setuptools.package-data]
agentsec = ["skillpacks/*/*.md", "skillpacks/*/*.json"]
